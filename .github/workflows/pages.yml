name: Update 0050 data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Asia/Taipei: 16:35, 18:35, 21:35. Later runs retry delayed vendor data.
    - cron: '35 8,10,13 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculation engine
        run: node tests/engine.test.cjs
      - name: Test adjustment gap recovery
        run: python -m unittest discover -s tests -p test_update_data.py
      - name: Update validated closing data
        run: python scripts/update_data.py
      - name: Validate published data
        run: node tests/data.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
